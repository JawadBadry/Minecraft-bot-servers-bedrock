<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>منصة بوتات ماينكرافت Bedrock</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #0f172a; color: #f8fafc; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
    .card { background: #1e293b; padding: 30px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); width: 100%; max-width: 420px; border: 1px solid #334155; }
    h2 { font-size: 1.5rem; text-align: center; margin-bottom: 20px; color: #38bdf8; }
    .form-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 6px; font-size: 0.9rem; color: #94a3b8; }
    input { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #334155; background-color: #0f172a; color: #fff; font-size: 1rem; outline: none; transition: 0.3s; }
    input:focus { border-color: #38bdf8; }
    button { width: 100%; padding: 12px; background: linear-gradient(135deg, #0284c7, #0369a1); border: none; border-radius: 8px; color: #fff; font-size: 1rem; font-weight: bold; cursor: pointer; transition: 0.3s; margin-top: 10px; }
    button:hover { background: linear-gradient(135deg, #0369a1, #075985); }
    .status-box { margin-top: 20px; padding: 12px; border-radius: 8px; background-color: #0f172a; border: 1px solid #334155; text-align: center; font-size: 0.95rem; display: none; }
  </style>
</head>
<body>

  <div class="card">
    <h2>🎮 تشغيل بوت ماينكرافت AFK</h2>
    <form id="botForm">
      <div class="form-group">
        <label>عنوان السيرفر (IP / Address):</label>
        <input type="text" id="ip" placeholder="مثال: my-server.aternos.me" required>
      </div>
      <div class="form-group">
        <label>منفذ السيرفر (Port):</label>
        <input type="text" id="port" placeholder="19132" value="19132" required>
      </div>
      <div class="form-group">
        <label>اسم البوت (Bot Name):</label>
        <input type="text" id="botName" placeholder="مثال: AFK_Bot" required>
      </div>
      <button type="submit">إرسال البوت للسيرفر</button>
    </form>

    <div id="statusBox" class="status-box"></div>
  </div>

  <script>
    document.getElementById('botForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const ip = document.getElementById('ip').value.trim();
      const port = document.getElementById('port').value.trim();
      const botName = document.getElementById('botName').value.trim();
      const statusBox = document.getElementById('statusBox');

      statusBox.style.display = 'block';
      statusBox.style.borderColor = '#334155';
      statusBox.style.color = '#38bdf8';
      statusBox.innerText = '⏳ جاري الاتصال بالسيرفر إرسال البوت...';

      try {
        const response = await fetch('/api/start-bot', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ ip, port, botName })
        });

        const data = await response.json();

        if (data.success) {
          statusBox.style.borderColor = '#22c55e';
          statusBox.style.color = '#4ade80';
          statusBox.innerText = '✅ ' + data.message;
        } else {
          statusBox.style.borderColor = '#ef4444';
          statusBox.style.color = '#f87171';
          statusBox.innerText = '❌ ' + data.message;
        }
      } catch (err) {
        statusBox.style.borderColor = '#f59e0b';
        statusBox.style.color = '#fbbf24';
        statusBox.innerText = '⚠️ تعذر الاتصال بالسيرفر الخلفي.';
      }
    });
  </script>
</body>
</html>
