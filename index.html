<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minecraft AFK Bot Service</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="card">
            <h1>☁️ CPS Cloud Bot</h1>
            <p class="subtitle">خدمة إبقاء سيرفرات ماينكرافت شغال 24/7</p>

            <form id="botForm">
                <div class="input-group">
                    <label for="ip">IP السيرفر:</label>
                    <input type="text" id="ip" placeholder="e.g. play.example.com" required>
                </div>

                <div class="input-group">
                    <label for="port">الميناء (Port):</label>
                    <input type="text" id="port" value="19132" required>
                </div>

                <div class="input-group">
                    <label for="botName">اسم البوت:</label>
                    <input type="text" id="botName" value="AFK_Bot_247" required>
                </div>

                <button type="submit" id="startBtn">تشغيل البوت الأن 🚀</button>
            </form>

            <div id="statusBox" class="status-box hidden">
                <p id="statusText">جاري معالجة الطلب...</p>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
